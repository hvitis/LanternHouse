name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

# One release build per tag; a re-run replaces the assets of the same release.
concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build deliverables and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Verify tag is on main branch
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "Verifying that tag '$RELEASE_TAG' is on main branch..."
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag '$RELEASE_TAG' is not on the main branch! Releases must only be cut from main."
            exit 1
          fi
          echo "Tag verified on main branch."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements/requirements.txt

      - name: Install system dependencies for FreeCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopengl0 \
            libglu1-mesa \
            libgl1 \
            libxcb-cursor0 \
            xvfb

      - name: Cache FreeCAD AppImage
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: FreeCAD-squashfs
          key: ${{ runner.os }}-freecad-1.1.4-linux-x86_64

      - name: Download & extract FreeCAD AppImage
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          echo "Downloading FreeCAD 1.1.4 AppImage..."
          curl --fail --location --retry 3 -o FreeCAD.AppImage "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage"
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract
          mv squashfs-root FreeCAD-squashfs
          rm FreeCAD.AppImage

      - name: Verify FreeCAD Python runtime
        run: |
          ./FreeCAD-squashfs/usr/bin/python -c "import sys,pathlib; sys.path.insert(0,str(pathlib.Path(sys.executable).resolve().parent.parent/'lib')); import FreeCAD, Part, Sketcher, numpy, shapely; print('FreeCAD runtime version:', '.'.join(str(x) for x in FreeCAD.Version()[:3]))"

      - name: Rebuild, check thickness, and package all deliverables
        env:
          LANTERNWOOD_HEADLESS: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          xvfb-run python source/rebuild.py --freecad-python "$PWD/FreeCAD-squashfs/usr/bin/python" --tolerance

      - name: Verify downloads and prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'source')
          import release
          from package import validate_release_kit
          validate_release_kit(Path('output'))
          Path('release-notes.md').write_text(release.notes(os.environ['RELEASE_TAG']))
          Path('release-assets.txt').write_text(''.join(str(p) + '\n' for p in release.assets()))
          PY

      - name: Keep the check reports when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ inputs.tag_name || github.ref_name }}
          path: |
            output/reports/
            output/nesting.json
            .build-work/**/output/reports/
            .build-work/**/output/nesting.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing GitHub Release for tag: $RELEASE_TAG"
          mapfile -t ASSETS < release-assets.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists: replacing its assets."
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "Lanternwood House $RELEASE_TAG" \
              --verify-tag \
              --notes-file release-notes.md
          fi
