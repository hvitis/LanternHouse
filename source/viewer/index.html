<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore the Moomin House plywood dollhouse in 3D. Open the walls, lift the roof and inspect every part.">
<title>Moomin House 3D</title>
<style>
  :root{--ink:#284849;--teal:#197F98;--rust:#B56535;--line:#d6ded4;--panel:#fbfaf6;--muted:#6b7f7f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#eef2ee;color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  #view{position:fixed;inset:0}
  #panel{position:fixed;top:12px;left:12px;width:280px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 4px 18px rgba(40,72,73,.12)}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:11px;margin-bottom:8px}
  h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:14px 0 6px}
  label.row{display:flex;align-items:center;gap:8px;margin:4px 0}
  .slider{display:grid;grid-template-columns:86px 1fr 46px;align-items:center;gap:6px;margin:5px 0}
  .slider output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  input[type=range]{width:100%;accent-color:var(--teal)}
  input[type=checkbox]{accent-color:var(--teal)}
  .seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
  .views{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  button{font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--teal)}
  button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  #info{position:fixed;right:12px;bottom:12px;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px rgba(40,72,73,.12);display:none}
  #info b{font-size:14px}
  #info .meta{color:var(--muted);font-size:12px;margin:2px 0 6px}
  #info .note{font-size:12px}
  #info .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#f3e3d5;color:var(--rust);margin-left:6px}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;color:var(--muted);font-size:11px;background:rgba(251,250,246,.85);padding:4px 10px;border-radius:12px;pointer-events:none}
  .dim{font:600 11px/1.2 system-ui,sans-serif;color:#126a84;background:rgba(255,255,255,.88);border:1px solid #9cc9d6;border-radius:4px;padding:1px 5px;white-space:nowrap;pointer-events:none}
  .dim.mark{color:#284849;border-color:#c8d0c8}
  .key{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px}
  .key.new{background:#3fae6b}.key.changed{background:#f0b93a}
  #changes{margin:0;padding-left:16px;font-size:11.5px;color:var(--ink)}#changes li{margin:2px 0}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted)}
  @media (max-width:700px){#view{top:calc(45% + 24px)}#panel{width:auto;right:12px;max-height:45%}#info{left:12px;width:auto}#hint{width:max-content;max-width:calc(100% - 24px);text-align:center}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="view"></div>
<div id="loading" role="status" aria-live="polite">Loading the 3D house…</div>
<noscript><p>The 3D viewer needs JavaScript. Enable JavaScript and reload this page.</p><style>#loading,#panel,#hint{display:none}</style></noscript>
<script>
  function showViewerError() {
    let status = document.getElementById('loading');
    if (!status) {
      status = document.createElement('div');
      status.id = 'loading';
      document.body.appendChild(status);
    }
    status.setAttribute('role', 'alert');
    status.textContent = 'The 3D viewer could not load. Reload the page and make sure your browser supports WebGL.';
  }
  addEventListener('error', showViewerError);
  addEventListener('unhandledrejection', showViewerError);
</script>
<aside id="panel">
  <h1>Moomin House 3D</h1>
  <div class="sub" id="stats"></div>

  <h2>Open</h2>
  <div class="slider"><span>Front walls</span><input id="walls" type="range" min="0" max="110" value="0"><output id="wallsOut">0°</output></div>
  <div class="slider"><span>Front doors</span><input id="doors" type="range" min="0" max="90" value="0"><output id="doorsOut">0°</output></div>
  <div class="slider"><span>Drawer</span><input id="drawer" type="range" min="0" max="220" value="0"><output id="drawerOut">0 mm</output></div>
  <div style="margin:6px 0 2px">Roof and attic</div>
  <div class="seg" id="roofSeg">
    <button data-roof="on" class="on">Roof on</button>
    <button data-roof="lifted">Lift roof</button>
    <button data-roof="off">Remove roof</button>
    <button data-roof="attic">Remove roof + attic</button>
  </div>
  <div class="actions"><button id="openAll">Open everything</button><button id="closeAll">Close everything</button></div>

  <h2>Show</h2>
  <label class="row"><input type="checkbox" id="showPorch" checked> Veranda</label>
  <label class="row"><input type="checkbox" id="showFurniture" checked> Furniture (view only)</label>
  <label class="row"><input type="checkbox" id="showFigures" checked> Thermo-clay Moomins (one per floor)</label>
  <label class="row"><input type="checkbox" id="showHardware"> Screws, bolts and hinge axes</label>
  <label class="row"><input type="checkbox" id="showEdges" checked> Plywood edges</label>
  <label class="row"><input type="checkbox" id="xray"> X-ray walls</label>
  <label class="row"><input type="checkbox" id="showDims" checked> Dimensions</label>
  <label class="row"><input type="checkbox" id="highlight"> Highlight changes: <span class="key new"></span> new <span class="key changed"></span> changed</label>

  <h2>Inspect</h2>
  <div class="slider"><span>Explode</span><input id="explode" type="range" min="0" max="100" value="0"><output id="explodeOut">0%</output></div>
  <div class="slider"><span>Cut above</span><input id="cut" type="range" min="0" max="710" value="710"><output id="cutOut">off</output></div>

  <h2>View</h2>
  <div class="views">
    <button data-view="iso">3/4</button><button data-view="front">Front</button><button data-view="back">Back</button><button data-view="top">Top</button>
    <button data-view="left">Left</button><button data-view="right">Right</button><button data-view="veranda">Veranda</button><button data-view="fit">Fit</button>
  </div>
  <h2>What changed</h2>
  <ul id="changes"></ul>
</aside>
<div id="info"></div>
<div id="hint">Drag to orbit · right-drag or shift-drag to pan · scroll to zoom · click a part to inspect it · Esc clears</div>
<script type="module" src="./app.js"></script>
</body>
</html>
