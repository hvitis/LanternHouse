# Build only the static viewer on pushes and pull requests; publish main to GitHub Pages.
# The full CAD/PDF build runs only in release.yml. Tests run locally.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    name: Build the viewer site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Cache viewer model and DXF
        id: viewer-data
        uses: actions/cache@v4
        with:
          path: _site/data
          # Web assets and published prints are copied fresh on every export.
          # No fallback keys: changed model inputs must rebuild the data.
          key: viewer-data-v2-${{ runner.os }}-py312-${{ hashFiles('source/**/*.py', 'source/**/*.json', 'ops/**', 'requirements.txt', '.github/workflows/ci.yml') }}
      - name: Export static viewer
        env:
          REUSE_VIEWER_DATA: ${{ steps.viewer-data.outputs.cache-hit }}
        run: |
          if [ "$REUSE_VIEWER_DATA" = 'true' ]; then
            python source/export_viewer.py _site --reuse-data
          else
            python source/export_viewer.py _site
          fi
      # Pages deploys from main only: the github-pages environment rejects tags, and main already carries the tag's commit.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: viewer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v5
